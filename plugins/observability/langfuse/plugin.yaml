name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Qwerty — traces conversations, LLM calls, and tool usage. Opt-in via `qwerty plugins enable observability/langfuse` or `qwerty tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - QWERTY_LANGFUSE_PUBLIC_KEY
  - QWERTY_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
